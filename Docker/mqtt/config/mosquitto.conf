# TCP listener (devices, forwarder)
listener 1883

# WebSocket listener (edge functions — edge runtime blocks raw TCP)
listener 9001
protocol websockets

# Persistence: queue QoS 1+ messages for offline clients with long-term
# retention so mid-duration Supabase/forwarder outages do not cause sales
# to drop off the broker before the device/forwarder can replay them.
#
# - 50k queued messages per client: with ~500 sales/device/day this buffers
#   ~100 days for a single device backlog, or 500 devices for 1 day.
# - 7d session expiry: covers weekend + holiday outages without losing
#   the forwarder's persistent session.
# - 100 inflight: matches the drain-window the forwarder can cope with.
persistence true
persistence_location /mosquitto/data
max_queued_messages 50000
max_inflight_messages 100
persistent_client_expiration 7d

# Authentication & Authorization
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# The ACL file is read at startup only. After changing it, reload with
#
#     docker compose kill -s HUP broker
#
# (a SIGHUP re-reads passwd + acl without dropping any client), or restart
# the broker. Until then the broker keeps enforcing the ACL it started with.
#
# A publish the ACL denies is *silent* at the default log level: the broker
# ACKs it, drops it, and tells nobody — the device sees a successful QoS 1
# publish while no subscriber ever receives the message. To see denials
# while debugging, uncomment the line below and reload:
#
# log_type all
