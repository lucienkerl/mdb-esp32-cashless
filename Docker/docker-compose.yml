# Usage
#   Start:          docker compose up -d
#   Stop:           docker compose down
#   Destroy:        docker compose down -v --remove-orphans
#   Logs:           docker compose logs -f [service]

name: vmflow

services:

  # ==========================================================================
  # Management Frontend (Nuxt 4)
  # ==========================================================================

  frontend:
    image: ghcr.io/lucienkerl/mdb-esp32-cashless/frontend:latest
    build:
      context: ../management-frontend
      args:
        GIT_HASH: ${GIT_HASH:-unknown}
        BUILD_DATE: ${BUILD_DATE:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
      NUXT_PUBLIC_SUPABASE_KEY: ${ANON_KEY}
      NUXT_PUBLIC_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      NUXT_PUBLIC_GITHUB_FIRMWARE_REPO: ${GITHUB_FIRMWARE_REPO:-}
      NUXT_PUBLIC_ENV_NAME: ${ENV_NAME:-}
      NUXT_PUBLIC_ENV_COLOR: ${ENV_COLOR:-amber}
      # Publicly reachable frontend origin, used for the QR codes on printed
      # machine posters. Same value GoTrue gets as GOTRUE_SITE_URL.
      NUXT_PUBLIC_SITE_URL: ${SITE_URL}
      # SHA-256 signing certificate fingerprint(s) of the Android app, comma-
      # separated. Served in /.well-known/assetlinks.json so password managers
      # offer the dashboard's saved login in the app. Empty = file not served.
      NUXT_APP_ASSOCIATION_ANDROID_SHA256: ${ANDROID_APP_SHA256:-}

  # ==========================================================================
  # MQTT Broker & Forwarder
  # ==========================================================================

  broker:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    ports:
      - "${MQTT_PUBLIC_PORT:-1883}:1883"
      - "9001:9001"
    volumes:
      - ./mqtt/config:/mosquitto/config
      - ./mqtt/data:/mosquitto/data
    # TCP-port probe instead of mosquitto_pub. Earlier we published to
    # /healthcheck/ping/status every 5s as the liveness signal — but that
    # topic matches the forwarder's /+/+/status wildcard, so each probe
    # went through mqtt-webhook -> 500 (uuid parse fail on "ping") -> DLQ
    # retry loop, pegging the whole stack. A TCP-connect to the listener
    # port is enough to know mosquitto is alive without polluting topics.
    healthcheck:
      test: ["CMD", "nc", "-z", "-w", "2", "localhost", "1883"]
      interval: 30s
      timeout: 5s
      retries: 3

  forwarder:
    build:
      context: ./mqtt/forwarder
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
    environment:
      MQTT_HOST: broker
      MQTT_ADMIN_USER: ${MQTT_ADMIN_USER:-admin}
      MQTT_ADMIN_PASS: ${MQTT_ADMIN_PASS}
      SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
      MQTT_WEBHOOK_SECRET: ${MQTT_WEBHOOK_SECRET}
      DLQ_PATH: /data/dlq.db
    volumes:
      # Persistent dead-letter queue. Survives forwarder restarts and buffers
      # failed webhook calls for the length of the drain loop's retry window
      # (capped at 500 attempts / ~1 week), so Supabase outages longer than
      # the broker's retention do not lose sales.
      - forwarder_dlq:/data

  # ==========================================================================
  # Supabase Studio
  # ==========================================================================

  studio:
    image: supabase/studio:2025.06.30-sha-6f5982d
    restart: unless-stopped
    # Docker-supplied init (tini) as PID 1. Node-based healthchecks below
    # spawn child processes that the studio Next.js server (PID 1 without
    # init) does not reap — observed 105 [node] <defunct> zombies in 4h.
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://studio:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})"
        ]
      timeout: 10s
      # Was 5s — combined with similar 5s healthchecks across 7 services
      # the constant docker-exec churn pinned runc+containerd at 30%+ CPU
      # and pushed kernel %sys to ~70%, making every new TCP connection
      # slow. 30s is plenty for a liveness signal here.
      interval: 30s
      retries: 3
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}

      LOGFLARE_PRIVATE_ACCESS_TOKEN: ${LOGFLARE_PRIVATE_ACCESS_TOKEN}
      LOGFLARE_URL: http://analytics:4000
      NEXT_PUBLIC_ENABLE_LOGS: true
      NEXT_ANALYTICS_BACKEND_PROVIDER: postgres

  # ==========================================================================
  # Supabase API Gateway (Kong)
  # ==========================================================================

  kong:
    image: kong:2.8.1
    restart: unless-stopped
    ports:
      - ${KONG_HTTP_PORT}:8000/tcp
    volumes:
      - ./volumes/api/kong.yml:/home/kong/temp.yml:ro,z
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    entrypoint: bash -c 'eval "echo \"$$(cat ~/temp.yml)\"" > ~/kong.yml && /docker-entrypoint.sh kong docker-start'

  # ==========================================================================
  # MCP Bridge (OpenAPI -> MCP, for OpenClaw & other MCP clients)
  # See docs/integrations/openclaw-mcp-bridge.md
  # ==========================================================================

  mcp-bridge:
    build:
      context: ./mcp-bridge
    restart: unless-stopped
    # No published host port: reached only via the Kong route
    # /mcp -> http://mcp-bridge:8080/mcp, fronted by the same TLS vhost as the API.
    environment:
      # Upstream API, internal. Trailing slash is required (see server.py).
      MCP_API_BASE_URL: http://kong:8000/api/v1/
      MCP_OPENAPI_SPEC: /app/openapi.yaml
      MCP_PATH: /mcp
      MCP_PORT: "8080"
      # Auth: NO key stored here — each MCP client sends its own X-API-Key, which
      # we forward per request to the API. Revoke the key in the dashboard to cut access.
      # Safety: the two destructive device actions are hidden ($$ = literal $ in compose).
      MCP_EXCLUDE_PATTERNS: "^/actions/trigger-ota$$,^/actions/send-config$$"
      # Set to "true" to expose ONLY read (GET) tools.
      MCP_READONLY: ${MCP_READONLY:-false}
    volumes:
      # The OpenAPI spec is the single source of truth for the exposed tools.
      - ./supabase/functions/api-v1/openapi.yaml:/app/openapi.yaml:ro
    depends_on:
      kong:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==========================================================================
  # Supabase Auth (GoTrue)
  # ==========================================================================

  auth:
    image: supabase/gotrue:v2.177.0
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9999/health"
        ]
      timeout: 5s
      interval: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}

      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}

      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}

      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}

      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE}

      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP}
      GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM}

  # ==========================================================================
  # Supabase REST (PostgREST)
  # ==========================================================================

  rest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    command: ["postgrest"]

  # ==========================================================================
  # Supabase Realtime
  # ==========================================================================

  realtime:
    container_name: realtime-dev.supabase-realtime
    image: supabase/realtime:v2.34.47
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Every health-check hit on /api/tenants/<id>/health spins up a fresh
    # DB connection and re-runs the migration check ("Applying migrations
    # to db" -> "Migrations already up"). At interval: 5s that bursts to
    # ~140% CPU on the realtime container + Postgres pegging on
    # realtime.list_changes and CREATE TABLE IF NOT EXISTS schema_migrations.
    # 30s is more than enough for liveness and cuts the storm 6x.
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sSfL",
          "--head",
          "-o",
          "/dev/null",
          "-H",
          "Authorization: Bearer ${ANON_KEY}",
          "http://localhost:4000/api/tenants/realtime-dev/health"
        ]
      timeout: 5s
      interval: 30s
      retries: 3
    environment:
      PORT: 4000
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: true
      RUN_JANITOR: true

  # ==========================================================================
  # Supabase Storage
  # ==========================================================================

  storage:
    image: supabase/storage-api:v1.25.7
    restart: unless-stopped
    volumes:
      - ./volumes/storage:/var/lib/storage:z
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://storage:5000/status"
        ]
      timeout: 5s
      interval: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
      imgproxy:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001

  # ==========================================================================
  # Image Proxy
  # ==========================================================================

  imgproxy:
    image: darthsim/imgproxy:v3.8.0
    restart: unless-stopped
    volumes:
      - ./volumes/storage:/var/lib/storage:z
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      timeout: 5s
      interval: 30s
      retries: 3
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: ${IMGPROXY_ENABLE_WEBP_DETECTION}

  # ==========================================================================
  # Supabase Postgres Meta
  # ==========================================================================

  meta:
    image: supabase/postgres-meta:v0.91.0
    restart: unless-stopped
    # tini reaps the Node child processes spawned by the image's HEALTHCHECK
    # (`node -e fetch(...)`). Without this, postgres-meta's Express server
    # is PID 1 and does not reap children — main observed zombie source.
    init: true
    # Override the image's built-in 5s HEALTHCHECK with a longer interval.
    # The image only has `node` available (no wget/curl), so reuse the same
    # test, just less often.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health').then((r) => {if (r.status !== 200) throw new Error(r.status)})"
        ]
      timeout: 10s
      interval: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: ${POSTGRES_HOST}
      PG_META_DB_PORT: ${POSTGRES_PORT}
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}

  # ==========================================================================
  # Supabase Edge Functions (Deno)
  # ==========================================================================

  functions:
    image: supabase/edge-runtime:v1.67.4
    restart: unless-stopped
    volumes:
      - ./supabase/functions:/home/deno/functions:Z
      - deno-cache:/root/.cache/deno
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      VERIFY_JWT: "${FUNCTIONS_VERIFY_JWT}"
      MQTT_HOST: broker
      MQTT_WS_PORT: "9001"
      MQTT_PUBLIC_HOST: ${MQTT_PUBLIC_HOST:-mqtt.vmflow.xyz}
      MQTT_PUBLIC_PORT: ${MQTT_PUBLIC_PORT:-1883}
      MQTT_WEBHOOK_SECRET: ${MQTT_WEBHOOK_SECRET}
      MQTT_ADMIN_USER: ${MQTT_ADMIN_USER:-admin}
      MQTT_ADMIN_PASS: ${MQTT_ADMIN_PASS}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      GITHUB_FIRMWARE_REPO: ${GITHUB_FIRMWARE_REPO:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_PRIVATE_KEY: ${APNS_PRIVATE_KEY:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
      APNS_PRODUCTION: ${APNS_PRODUCTION:-false}
    command: ["start", "--main-service", "/home/deno/functions/main"]

  # ==========================================================================
  # PostgreSQL
  # ==========================================================================

  db:
    image: supabase/postgres:15.8.1.060
    ports:
      - "[::1]:5432:5432"
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    # EVERY file mounted here MUST exist in the repo. Docker materialises a
    # missing bind-mount source as an empty DIRECTORY, and the image's
    # migrate.sh runs `psql -v ON_ERROR_STOP=1 -f` over init-scripts/*.sql
    # under `set -e`: the first directory aborts the whole init run, so every
    # later script (99-roles.sql!) silently never executes. The container then
    # restarts, finds PGDATA initialised, skips init for good and comes up
    # looking healthy — with authenticator/supabase_auth_admin/
    # supabase_storage_admin left without a password. That broke every fresh
    # install between 2026-01-04 (df239b3 deleted the files) and 2026-08-09.
    # Do not add a mount here without committing the file. Ordering matters
    # too: 98-webhooks.sql creates supabase_functions_admin, which
    # 99-roles.sql then ALTERs.
    volumes:
      - ./volumes/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:Z
      - ./volumes/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:Z
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      - ./volumes/db/data:/var/lib/postgresql/data:Z
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 30s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
    # Postgres tuning via -c flags overrides postgresql.conf and
    # postgresql.auto.conf. Source of truth: this file. Default
    # supabase/postgres image ships with shared_buffers=128MB which
    # saturates a 4-core / 8 GB host once the realtime polling kicks in
    # (see realtime.list_changes burst in superpowers-debug 2026-05-25).
    # To change a value: edit here, then `docker compose up -d db`.
    # shared_preload_libraries below MUST stay a superset of the pinned image's
    # baked default — Postgres treats this GUC as SET (not APPEND). Recapture
    # when bumping the image tag:
    #   docker run --rm --entrypoint cat supabase/postgres:<TAG> \
    #     /etc/postgresql/postgresql.conf | grep '^shared_preload_libraries'
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "log_min_messages=fatal",
        "-c",
        "shared_buffers=2GB",
        "-c",
        "effective_cache_size=6GB",
        "-c",
        "work_mem=16MB",
        "-c",
        "maintenance_work_mem=512MB",
        "-c",
        "random_page_cost=1.1",
        "-c",
        "effective_io_concurrency=200",
        "-c",
        "wal_buffers=16MB",
        "-c",
        "checkpoint_completion_target=0.9",
        "-c",
        "max_wal_size=2GB",
        "-c",
        "min_wal_size=512MB",
        "-c",
        "shared_preload_libraries=pg_stat_statements,pgaudit,plpgsql,plpgsql_check,pg_cron,pg_net,pgsodium,timescaledb,auto_explain,pg_tle,plan_filter,supabase_vault",
        "-c",
        "cron.database_name=postgres"
      ]

volumes:
  db-config:
  deno-cache:
  forwarder_dlq:
