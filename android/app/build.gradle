// Auto-increment versionCode from git commit count (mirrors iOS behavior)
def gitCommitCount = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-list', '--count', 'HEAD'
            standardOutput = stdout
            ignoreExitValue = true
        }
        return stdout.toString().trim().toInteger()
    } catch (Exception ignored) {
        return 1
    }
}

android {
    namespace 'de.kerlhandel.vmflow'
    compileSdk 36

    defaultConfig {
        applicationId "de.kerlhandel.vmflow"
        minSdk 26
        targetSdk 36
        versionCode gitCommitCount()
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    flavorDimensions += "env"
    productFlavors {
        dev {
            dimension "env"
            applicationIdSuffix ".debug"
            versionNameSuffix "-dev"
            buildConfigField "String", "SUPABASE_URL", "\"${project.findProperty('SUPABASE_URL_DEV') ?: 'http://10.0.1.130:54321'}\""
            buildConfigField "String", "SUPABASE_ANON_KEY", "\"${project.findProperty('SUPABASE_ANON_KEY_DEV') ?: 'sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH'}\""
            buildConfigField "String", "DEFAULT_SERVER_NAME", "\"VMflow Dev\""
        }
        prod {
            dimension "env"
            buildConfigField "String", "SUPABASE_URL", "\"${project.findProperty('SUPABASE_URL') ?: 'https://supabase.kerl-handel.de'}\""
            buildConfigField "String", "SUPABASE_ANON_KEY", "\"${project.findProperty('SUPABASE_ANON_KEY') ?: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzcyMzc3NzY3LCJleHAiOjIwODc3Mzc3Njd9.5Mu3-BgmHhekSP6vm0W20iwwT3mOjcYQPjO9b-oqgwA'}\""
            buildConfigField "String", "DEFAULT_SERVER_NAME", "\"VMflow Cloud\""
        }
    }

    buildTypes {
        debug {
            // Keep inspectable in debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            '-opt-in=kotlin.RequiresOptIn',
            '-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi',
            '-opt-in=androidx.compose.material3.ExperimentalMaterial3Api',
            '-opt-in=androidx.compose.material3.adaptive.ExperimentalMaterial3AdaptiveApi',
            '-opt-in=androidx.compose.foundation.layout.ExperimentalLayoutApi',
            '-opt-in=androidx.compose.foundation.ExperimentalFoundationApi',
            '-opt-in=io.github.jan.supabase.annotations.SupabaseInternal',
            '-opt-in=io.github.jan.supabase.annotations.SupabaseExperimental',
        ]
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packaging {
        resources {
            excludes += [
                '/META-INF/{AL2.0,LGPL2.1}',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
            ]
        }
    }
}

